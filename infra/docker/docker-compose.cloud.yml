version: '3.9'

# Template for the future Hostinger VPS cloud stack. Not deployed from
# this repository — see infra/docker/README.md and
# docs/cloud/HOSTINGER_VPS_SETUP.md before ever running this file.

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  prometheus_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    networks:
      - backend
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - ./reverse-proxy.conf.example:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend
    env_file: ./.env.cloud.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    # Backup hook: infra/backups/backup-postgres.sh.example targets this
    # volume via POSTGRES_URL — not run automatically by this file.

  redis:
    image: redis:7-alpine
    user: '999:999'
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    networks:
      - backend
    env_file: ./.env.cloud.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:5678/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  ai-gateway:
    build:
      context: ../..
      dockerfile: ./apps/ai-gateway/Dockerfile
    user: node
    # No real long-running server exists yet (src/index.ts runs a
    # one-shot demonstration) — restart: "no" reflects that honestly.
    # Switch to unless-stopped once a real server loop is implemented.
    restart: 'no'
    networks:
      - backend
    env_file: ./.env.cloud.example
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  agent-worker:
    build:
      context: ../..
      dockerfile: ./apps/worker-service/Dockerfile
    user: node
    restart: 'no'
    networks:
      - backend
    env_file: ./.env.cloud.example
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  monitoring:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ../monitoring/prometheus.yml.example:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
